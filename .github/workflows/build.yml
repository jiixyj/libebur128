name: build

on:
  push:
  pull_request:

env:
  ASAN_OPTIONS: halt_on_error=1
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  TSAN_OPTIONS: halt_on_error=1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
        sanitizer: [none, thread, address-undefined]
        include:
          - os: ubuntu-24.04
            name: Ubuntu 24.04
            ctest_parallel: 4
          - os: ubuntu-24.04-arm
            name: Ubuntu 24.04 ARM
            ctest_parallel: 4
          - os: macos-15
            name: macOS 15
            ctest_parallel: 3
          - os: windows-2022
            name: Windows 2022
            cmake_config: --config RelWithDebInfo
            ctest_config: --build-config RelWithDebInfo
            ctest_parallel: 4
        exclude:
          - os: windows-2022
            sanitizer: thread

    name: ${{ matrix.name }} / ${{ matrix.sanitizer }}
    runs-on: ${{ matrix.os }}
    steps:
    - name: Check out Git repository
      uses: actions/checkout@v4

    - name: Show CPU
      if: runner.os == 'Linux'
      run: lscpu

    - name: Add MSVC ASan runtime to PATH
      if: runner.os == 'Windows' && matrix.sanitizer == 'address-undefined'
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        $msvcDir = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
        "$($msvcDir.FullName)\bin\Hostx64\x64" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

    - name: Configure
      shell: bash
      env:
        SANITIZER: ${{ matrix.sanitizer }}
        RUNNER_OS: ${{ runner.os }}
        MSYS_NO_PATHCONV: 1
        MSYS2_ARG_CONV_EXCL: "*"
      run: |
        cflags=""
        linker_flags=""
        case "$SANITIZER" in
          thread)
            cflags="-fsanitize=thread"
            linker_flags="$cflags"
            ;;
          address-undefined)
            if [ "$RUNNER_OS" = "Windows" ]; then
              cflags="/fsanitize=address"
            else
              cflags="-fsanitize=address,undefined"
              linker_flags="$cflags"
            fi
            ;;
        esac

        cmake -S . -B build \
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
          -DBUILD_SHARED_LIBS=ON \
          -DBUILD_TESTING=ON \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DEBUR128_TEST_PERFORMANCE=${{ matrix.sanitizer == 'none' }} \
          -DCMAKE_C_FLAGS="$cflags" \
          -DCMAKE_CXX_FLAGS="$cflags" \
          -DCMAKE_EXE_LINKER_FLAGS="$linker_flags" \
          -DCMAKE_SHARED_LINKER_FLAGS="$linker_flags"

    - name: Build
      run: cmake --build build ${{ matrix.cmake_config }}
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: 2

    - name: Test
      run: >-
        ctest --test-dir build ${{ matrix.ctest_config }}
        --parallel ${{ matrix.ctest_parallel }}
        --output-on-failure -E '^ebur128[.]malloc_fail$'

    - name: Test malloc failure paths under leak detection
      if: runner.os == 'Linux' && matrix.sanitizer == 'address-undefined'
      env:
        ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      run: ctest --test-dir build ${{ matrix.ctest_config }} --output-on-failure -R '^ebur128[.]malloc_fail$'

    - name: Install
      if: matrix.sanitizer == 'none'
      run: cmake --install build ${{ matrix.cmake_config }}

    - name: Upload Build Artifact
      if: matrix.sanitizer == 'none'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }} libebur128 build
        path: ${{ github.workspace }}/install

  coverage-32:
    name: Ubuntu 24.04 / 32-bit coverage
    runs-on: ubuntu-24.04
    steps:
    - name: Check out Git repository
      uses: actions/checkout@v4

    - name: Install coverage dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang \
          llvm \
          libclang-rt-18-dev \
          lcov \
          zsh \
          ninja-build \
          g++-multilib \
          g++-14-multilib \
          libc6-dev-i386 \
          python3

    - name: Configure
      run: |
        cmake -S . -B build-coverage32 -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DBUILD_SHARED_LIBS=ON \
          -DBUILD_TESTING=ON \
          -DEBUR128_COVERAGE=ON \
          -DEBUR128_TEST_PERFORMANCE=ON \
          -DEBUR128_TEST_MALLOC_FAIL=ON \
          -DCMAKE_C_FLAGS="-m32 -std=c89 -pedantic" \
          -DCMAKE_CXX_FLAGS="-m32"

    - name: Build
      run: cmake --build build-coverage32
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: 2

    - name: Generate coverage report
      working-directory: build-coverage32
      run: ../tools/check_coverage.sh

    - name: Check coverage thresholds
      working-directory: build-coverage32
      run: >-
        python3 ../tools/check_coverage_thresholds.py show.lcov
        --min-lines 100 --min-branches 85 --min-functions 100

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-32
        path: |
          build-coverage32/show.html
          build-coverage32/show.lcov
          build-coverage32/report.txt
          build-coverage32/lcov-report/

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    steps:
    - name: Check out Git repository
      uses: actions/checkout@v4

    - name: Build, install, and test in FreeBSD
      uses: vmactions/freebsd-vm@v1
      with:
        copyback: false
        prepare: |
          set -e
          pkg -4 update -f
          pkg -4 install -y cmake gmake pkgconf
        run: |
          set -e
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON \
            -DEBUR128_TEST_PKGCONFIG=ON
          cmake --build build --parallel 2
          cmake --install build
          ctest --test-dir build --output-on-failure --parallel 2

  openbsd:
    name: OpenBSD
    runs-on: ubuntu-latest
    steps:
    - name: Check out Git repository
      uses: actions/checkout@v4

    - name: Build, install, and test in OpenBSD
      uses: vmactions/openbsd-vm@v1
      with:
        copyback: false
        prepare: |
          set -e
          pkg_add cmake gmake
        run: |
          set -e
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON \
            -DEBUR128_TEST_PKGCONFIG=ON
          cmake --build build --parallel 2
          cmake --install build
          ctest --test-dir build --output-on-failure --parallel 2

  netbsd:
    name: NetBSD
    runs-on: ubuntu-latest
    steps:
    - name: Check out Git repository
      uses: actions/checkout@v4

    - name: Build, install, and test in NetBSD
      uses: vmactions/netbsd-vm@v1
      with:
        copyback: false
        prepare: |
          set -e
          /usr/sbin/pkg_add -u cmake gmake pkgconf
        run: |
          set -e
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON \
            -DEBUR128_TEST_PKGCONFIG=ON
          cmake --build build --parallel 2
          cmake --install build
          ctest --test-dir build --output-on-failure --parallel 2

  haiku:
    name: Haiku
    runs-on: ubuntu-latest
    steps:
    - name: Check out Git repository
      uses: actions/checkout@v4

    - name: Build, install, and test in Haiku
      uses: vmactions/haiku-vm@v1
      with:
        copyback: false
        prepare: |
          set -e
          pkgman install -y cmake make pkgconfig gcc
        run: |
          set -e
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=ON \
            -DEBUR128_TEST_PKGCONFIG=ON
          cmake --build build --parallel 2
          cmake --install build
          ctest --test-dir build --output-on-failure --parallel 2
